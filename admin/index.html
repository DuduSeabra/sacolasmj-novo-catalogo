<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Sacolas MJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue-med:#2581C2;
  --blue-deep:#28235A;
  --white:#FFFFFF;
  --off:#FAFBFD;
  --cream:#F5F7FA;
  --line:#E3EAF2;
  --ink:#14163A;
  --ink-soft:#3C4365;
  --muted:#7A819C;
  --wa-dark:#128C7E;
  --red:#D93535;
  --green:#1A8F4E;
  --sans:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);font-size:15px;line-height:1.55;
  color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased;
}
.header{
  background:var(--blue-deep);color:#fff;
  padding:0 24px;height:60px;
  display:flex;align-items:center;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.18);
}
.header-title{
  display:flex;align-items:center;gap:10px;
  font-size:16px;font-weight:600;letter-spacing:-.01em;
}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 120px}
.alert-info{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border-radius:8px;font-size:13px;
  margin-bottom:24px;line-height:1.45;
  background:var(--cream);color:var(--ink-soft);border:1px solid var(--line);
}
.section-head{
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:28px 0 12px;padding-bottom:8px;border-bottom:1.5px solid var(--line);
}
.product-card{
  background:var(--white);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:16px;
  box-shadow:0 1px 4px rgba(40,35,90,.04);overflow:hidden;
}
.product-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;cursor:pointer;user-select:none;
  border-bottom:1px solid transparent;transition:border-color .15s,background .15s;
}
.product-header:hover{background:var(--off)}
.product-header.open{border-bottom-color:var(--line)}
.product-name{font-weight:600;font-size:15px;color:var(--blue-deep)}
.product-id{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.chevron{transition:transform .2s;color:var(--muted);flex-shrink:0}
.product-header.open .chevron{transform:rotate(180deg)}
.product-body{display:none;padding:18px}
.product-header.open + .product-body{display:block}
.price-table-editor{width:100%;border-collapse:collapse;font-size:14px}
.price-table-editor th{
  text-align:left;padding:8px 10px;
  font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid var(--line);white-space:nowrap;
}
.price-table-editor th.col-qty{color:var(--ink-soft)}
.price-table-editor td{padding:6px 6px 6px 10px;border-bottom:1px solid var(--line)}
.price-table-editor tr:last-child td{border-bottom:none}
.qty-cell{
  font-family:var(--mono);font-size:13px;font-weight:500;
  color:var(--ink-soft);white-space:nowrap;padding-right:16px;
}
.price-input{
  width:80px;padding:7px 8px;
  border:1.5px solid var(--line);border-radius:6px;
  font-size:14px;font-family:var(--mono);font-weight:500;
  color:var(--blue-deep);text-align:right;
  background:var(--off);outline:none;transition:border-color .15s,background .15s;
}
.price-input:focus{border-color:var(--blue-med);background:var(--white)}
.price-input.changed{border-color:var(--wa-dark);background:#F0FFF6}
.prefix{font-size:13px;color:var(--muted);padding-right:4px}
.save-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);border-top:1px solid var(--line);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  box-shadow:0 -4px 20px rgba(40,35,90,.08);z-index:90;
}
.save-btn{
  padding:11px 28px;background:var(--blue-med);color:#fff;
  border:none;border-radius:8px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:var(--sans);transition:background .15s;
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.save-btn:hover:not(:disabled){background:var(--blue-deep)}
.save-btn:disabled{background:var(--muted);cursor:not-allowed}
.status{font-size:14px;color:var(--muted)}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}
.status.loading{color:var(--blue-med)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:none;
}
.save-btn.loading .spinner{display:block}
.save-btn.loading .btn-label{display:none}
@media(max-width:600px){
  .wrap{padding:20px 12px 120px}
  .save-bar{flex-direction:column-reverse;gap:10px;padding:12px 16px}
  .save-btn{width:100%;justify-content:center}
  .price-input{width:68px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    Sacolas MJ · Admin de Preços
  </div>
</div>

<div class="wrap">
  <div class="alert-info">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Edite os preços e clique em <strong>Salvar alterações</strong>. O site atualiza em ~30 segundos.</span>
  </div>
  <div id="product-list"></div>
</div>

<div class="save-bar">
  <div class="status" id="save-status"></div>
  <button class="save-btn" id="save-btn" onclick="saveAll()">
    <div class="spinner"></div>
    <span class="btn-label">Salvar alterações</span>
  </button>
</div>

<script>
const PRODUCTS_META = [
  {id:'kraft-cordinha',    name:'Kraft · alça cordinha',        cat:'Kraft',
   variants:[{key:'PP',label:'PP'},{key:'P',label:'P'},{key:'M',label:'M'},{key:'G',label:'G'}]},
  {id:'kraft-gorgurao',    name:'Kraft · alça gorgurão',        cat:'Kraft',
   variants:[{key:'PP',label:'PP'},{key:'P',label:'P'},{key:'M',label:'M'},{key:'G',label:'G'}]},
  {id:'kraft-promocional', name:'Kraft promocional',            cat:'Kraft',
   variants:[{key:'P',label:'P'},{key:'M',label:'M'},{key:'G',label:'G'}]},
  {id:'semijoias-cordinha',name:'Sacola semijoias · cordinha',  cat:'Papel branco',
   variants:[{key:'U',label:'Único'}]},
  {id:'semijoias-gorgurao',name:'Sacola semijoias · gorgurão',  cat:'Papel branco',
   variants:[{key:'U',label:'Único'}]},
  {id:'branca-gorgurao',   name:'Branca · alça gorgurão',       cat:'Papel branco',
   variants:[{key:'PP',label:'PP'},{key:'P',label:'P'},{key:'M',label:'M'},{key:'G',label:'G'}]},
  {id:'branca-promocional',name:'Branca promocional',           cat:'Papel branco',
   variants:[{key:'P',label:'P'},{key:'M',label:'M'},{key:'G',label:'G'}]},
  {id:'duplex-cordinha',   name:'Duplex · alça cordinha',       cat:'Papel branco',
   variants:[{key:'PP',label:'PP'},{key:'P',label:'P'},{key:'M',label:'M'},{key:'G',label:'G'}]},
  {id:'plastico-cadeado',  name:'Plástica · alça cadeado',      cat:'Plástico',
   variants:[{key:'A',label:'30×55cm'},{key:'B',label:'40×60cm'}]},
  {id:'plastico-camiseta', name:'Plástica · alça camiseta',     cat:'Plástico',
   variants:[
     {key:'A',label:'45×50 · 0,07'},{key:'B',label:'45×60 · 0,07'},{key:'C',label:'60×75 · 0,07'},
     {key:'D',label:'45×50 · 0,10'},{key:'E',label:'45×60 · 0,10'},{key:'F',label:'60×75 · 0,10'},
   ]},
  {id:'boca-palhaco',      name:'Boca de palhaço',              cat:'Plástico',
   variants:[
     {key:'A',label:'15×20 · 0,07'},{key:'B',label:'20×30 · 0,07'},{key:'C',label:'25×30 · 0,07'},
     {key:'D',label:'30×40 · 0,07'},{key:'E',label:'40×50 · 0,07'},
     {key:'F',label:'15×20 · 0,12'},{key:'G',label:'20×30 · 0,12'},{key:'H',label:'25×30 · 0,12'},
     {key:'I',label:'30×40 · 0,12'},{key:'J',label:'40×50 · 0,12'},
   ]},
  {id:'cristal-palhaco',   name:'Cristal · boca de palhaço',   cat:'Plástico',
   variants:[{key:'A',label:'15×20'},{key:'B',label:'20×30'},{key:'C',label:'25×30'},{key:'D',label:'30×40'},{key:'E',label:'40×50'}]},
  {id:'tnt-ecobag',        name:'Ecobag TNT',                   cat:'TNT · Ecobag',
   variants:[{key:'A',label:'27×35cm'},{key:'B',label:'34×40cm'},{key:'C',label:'43×40cm'}]},
  {id:'saco-tnt',          name:'Saco de TNT',                  cat:'TNT · Ecobag',
   variants:[{key:'A',label:'19×30cm'},{key:'B',label:'27×37cm'},{key:'C',label:'34×40cm'}]},
  {id:'envio',             name:'Saco de envio',                cat:'Envio',
   variants:[{key:'A',label:'30×42cm'},{key:'B',label:'40×50cm'}]},
];

let currentPrices = null;

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderApp(prices){
  const list = document.getElementById('product-list');
  let html = '';
  let lastCat = null;

  PRODUCTS_META.forEach(meta => {
    if(meta.cat !== lastCat){
      html += `<div class="section-head">${escH(meta.cat)}</div>`;
      lastCat = meta.cat;
    }
    const table = prices[meta.id] || [];
    const thCols = meta.variants.map(v => `<th style="text-align:right">${escH(v.label)}</th>`).join('');
    const rows = table.map((row, ri) => {
      const tds = meta.variants.map(({key}) => {
        const val = row.prices[key] ?? '';
        return `<td><span class="prefix">R$</span><input class="price-input" type="text"
          data-id="${escH(meta.id)}" data-row="${ri}" data-key="${escH(key)}"
          value="${escH(val)}" inputmode="decimal" placeholder="0,00"
          oninput="this.classList.add('changed')" onblur="fmtPrice(this)"></td>`;
      }).join('');
      return `<tr><td class="qty-cell">${row.qty} un</td>${tds}</tr>`;
    }).join('');

    html += `
    <div class="product-card">
      <div class="product-header" onclick="this.classList.toggle('open')">
        <div>
          <div class="product-name">${escH(meta.name)}</div>
          <div class="product-id">${escH(meta.id)}</div>
        </div>
        <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="product-body">
        <table class="price-table-editor">
          <thead><tr><th class="col-qty">Quantidade</th>${thCols}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  });

  list.innerHTML = html;
}

function fmtPrice(el){
  let v = el.value.replace(/[^\d.,]/g,'').replace('.',',');
  const m = v.match(/^(\d+)(?:[,.](\d{0,2}))?$/);
  if(m) el.value = m[1] + ',' + (m[2]||'00').padEnd(2,'0');
}

function collectPrices(){
  const prices = JSON.parse(JSON.stringify(currentPrices));
  document.querySelectorAll('.price-input').forEach(el => {
    const {id, row, key} = el.dataset;
    if(prices[id]?.[+row]) prices[id][+row].prices[key] = el.value.trim();
  });
  return prices;
}

async function saveAll(){
  const btn    = document.getElementById('save-btn');
  const status = document.getElementById('save-status');

  btn.disabled = true;
  btn.classList.add('loading');
  status.textContent = 'Salvando...';
  status.className   = 'status loading';

  try {
    const res = await fetch('/.netlify/functions/save-prices', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prices: collectPrices() }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    currentPrices = collectPrices();
    document.querySelectorAll('.price-input.changed').forEach(el => el.classList.remove('changed'));
    status.textContent = '✓ Salvo! O site atualiza em ~30 segundos.';
    status.className   = 'status ok';
    setTimeout(() => { status.textContent=''; status.className='status'; }, 8000);
  } catch(e) {
    status.textContent = '✗ Erro: ' + e.message;
    status.className   = 'status err';
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

// Load prices on start
(async () => {
  const list = document.getElementById('product-list');
  list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0">Carregando preços...</p>';
  try {
    const res = await fetch('/prices.json');
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    currentPrices = await res.json();
    renderApp(currentPrices);
  } catch(e) {
    list.innerHTML = `<p style="color:var(--red);text-align:center;padding:40px 0">Erro ao carregar: ${escH(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
